name: Build Android APK

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      gate1_isolated:
        description: 'Build the separate disposable Gate 1 app'
        required: false
        default: false
        type: boolean
      signing_test:
        description: 'Signed update for the existing com.gt.soundmaster.signingtest installation'
        required: false
        default: false
        type: boolean
      signing_test_preview:
        description: 'PR-only debug compile of signing-test identity without signing secrets'
        required: false
        default: false
        type: boolean
      signing_test_expected_sha256:
        description: 'Expected public certificate fingerprint; required in signed mode'
        required: false
        type: string
    secrets:
      GT_SIGNING_TEST_KEYSTORE_B64:
        required: false
      GT_SIGNING_TEST_STORE_PASSWORD:
        required: false
      GT_SIGNING_TEST_KEY_ALIAS:
        required: false
      GT_SIGNING_TEST_KEY_PASSWORD:
        required: false
  pull_request:
    paths:
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/gate1-test-apk.yml'
      - 'android-native/**'
      - 'scripts/generate-icon.cjs'
      - 'scripts/patch-android-project.py'
      - 'scripts/prepare-gate1-build.py'
      - 'scripts/mark-gate1-icon.cjs'
      - 'tests/gate1-build.test.mjs'
      - '.github/workflows/m4-signing-test.yml'
      - 'scripts/prepare-signing-test.sh'
      - 'tests/m4-signing.test.mjs'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GT_GATE1_ISOLATED: ${{ github.event_name == 'pull_request' && inputs.signing_test_preview != true || inputs.gate1_isolated == true }}
      GT_SIGNING_TEST_APP: ${{ inputs.signing_test == true || inputs.signing_test_preview == true }}
      GT_SIGNING_TEST_SIGNED: ${{ inputs.signing_test == true }}
      GT_SIGNING_TEST_BUILD_NUMBER: ${{ github.run_number }}
      GT_SIGNING_TEST_EXPECTED_CERT: ${{ inputs.signing_test_expected_sha256 }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bundle Web Files and Initialize Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/assets@latest sharp@latest

          node scripts/generate-icon.cjs
          if [ "$GT_GATE1_ISOLATED" = "true" ]; then
            node scripts/mark-gate1-icon.cjs
          fi

          mkdir -p www
          cp -r index.html css js manifest.json icon.svg icon.png www/

          npx cap init "GT SoundMaster" "com.gt.soundmaster" --web-dir www
          npx cap add android

          mkdir -p assets
          cp icon.png assets/logo.png
          cp icon.png assets/icon-only.png
          cp icon.png assets/icon-foreground.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#0b090c'

          python3 scripts/patch-android-project.py
          cp android-native/java/com/gt/soundmaster/MediaPlaybackService.java \
            android-native/java/com/gt/soundmaster/MainActivity.java \
            android/app/src/main/java/com/gt/soundmaster/

      - name: Prepare isolated Gate 1 Android identity
        if: env.GT_GATE1_ISOLATED == 'true'
        run: python3 scripts/prepare-gate1-build.py

      - name: Prepare separate signing-test Android identity
        if: env.GT_SIGNING_TEST_APP == 'true'
        run: python3 scripts/prepare-gate1-build.py --signing-test

      - name: Prepare approved signing-test release credentials
        if: env.GT_SIGNING_TEST_SIGNED == 'true'
        env:
          GT_SIGNING_TEST_KEYSTORE_B64: ${{ secrets.GT_SIGNING_TEST_KEYSTORE_B64 }}
          GT_SIGNING_TEST_STORE_PASSWORD: ${{ secrets.GT_SIGNING_TEST_STORE_PASSWORD }}
          GT_SIGNING_TEST_KEY_ALIAS: ${{ secrets.GT_SIGNING_TEST_KEY_ALIAS }}
          GT_SIGNING_TEST_KEY_PASSWORD: ${{ secrets.GT_SIGNING_TEST_KEY_PASSWORD }}
        run: |
          npx cap sync android
          bash scripts/prepare-signing-test.sh

      - name: Sync and Compile Debug APK
        if: env.GT_SIGNING_TEST_SIGNED != 'true'
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Compile signed signing-test release APK
        if: env.GT_SIGNING_TEST_SIGNED == 'true'
        env:
          GT_SIGNING_TEST_STORE_PASSWORD: ${{ secrets.GT_SIGNING_TEST_STORE_PASSWORD }}
          GT_SIGNING_TEST_KEY_ALIAS: ${{ secrets.GT_SIGNING_TEST_KEY_ALIAS }}
          GT_SIGNING_TEST_KEY_PASSWORD: ${{ secrets.GT_SIGNING_TEST_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify isolated package identity inside compiled APK
        if: env.GT_GATE1_ISOLATED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging android/app/build/outputs/apk/debug/app-debug.apk)"
          grep -F "package: name='com.gt.soundmaster.gate1'" <<< "$BADGING" > /dev/null
          grep -F "application-label:'GT SoundMaster TEST'" <<< "$BADGING" > /dev/null
          echo "Verified separate GT SoundMaster TEST identity in compiled APK."

      - name: Verify signing-test APK identity and certificate
        if: env.GT_SIGNING_TEST_APP == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GT_SIGNING_TEST_SIGNED" = "true" ]; then
            APK="android/app/build/outputs/apk/release/app-release.apk"
          else
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          AAPT="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -s "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -F "package: name='com.gt.soundmaster.signingtest'" <<< "$BADGING" > /dev/null
          grep -F "application-label:'GT SoundMaster'" <<< "$BADGING" > /dev/null
          if [ "$GT_SIGNING_TEST_SIGNED" = "true" ]; then
            APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
            test -x "$APKSIGNER"
            # Both apksigner and the parser must pass; never print key material
            # or certificate digests to CI logs.
            "$APKSIGNER" verify --print-certs "$APK" |
              python3 scripts/verify-signing-test-cert-output.py
            echo "Verified release APK signed with the expected signing-test certificate."
          fi
          echo "Verified isolated signing-test APK identity."

      - name: Remove temporary signing-test keystore
        if: always() && env.GT_SIGNING_TEST_SIGNED == 'true'
        run: rm -f "${RUNNER_TEMP}/gt-soundmaster-signingtest.jks"

      - name: Upload APK Artifact
        if: github.event_name == 'workflow_dispatch' && env.GT_GATE1_ISOLATED != 'true' && env.GT_SIGNING_TEST_APP != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GT-SoundMaster-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload isolated Gate 1 test APK
        if: github.event_name == 'workflow_dispatch' && env.GT_GATE1_ISOLATED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GT-SoundMaster-Gate1-TEST-debug-only
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload signed GT SoundMaster update APK (manual only)
        if: github.event_name == 'workflow_dispatch' && env.GT_SIGNING_TEST_SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GT-SoundMaster-SIGNED-APP-release-only
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
