<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1c28"/>
      <stop offset="70%" stop-color="#121218"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <linearGradient id="redNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b3b"/>
      <stop offset="100%" stop-color="#e61919"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

  <circle cx="256" cy="256" r="185" fill="#151520" stroke="#252535" stroke-width="6"/>
  
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#redNeon)" stroke-width="8" stroke-dasharray="240 920" stroke-dashoffset="-40" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#cyanNeon)" stroke-width="8" stroke-dasharray="320 840" stroke-dashoffset="-380" stroke-linecap="round" filter="url(#glowCyan)"/>

  <circle cx="256" cy="256" r="120" fill="#0e0e14" stroke="rgba(0,229,255,0.2)" stroke-width="3"/>

  <g transform="translate(256, 256)">
    <rect x="-80" y="-30" width="12" height="60" rx="6" fill="#ff2a2a"/>
    <rect x="-50" y="-55" width="12" height="110" rx="6" fill="#ff4d4d"/>
    <rect x="-20" y="-85" width="12" height="170" rx="6" fill="#00e5ff" filter="url(#glowCyan)"/>
    <rect x="10" y="-60" width="12" height="120" rx="6" fill="#00e5ff"/>
    <rect x="40" y="-95" width="12" height="190" rx="6" fill="url(#cyanNeon)" filter="url(#glowCyan)"/>
    <rect x="70" y="-40" width="12" height="80" rx="6" fill="#39ff14"/>
  </g>

  <circle cx="256" cy="256" r="15" fill="#ffffff"/>
  <circle cx="256" cy="256" r="6" fill="#ff2a2a"/>
</svg>
